# ============================================================================
# 后端 Service —— **两个**，各有各的用途，缺一不可
#
#   1. z-surl-backend-headless (clusterIP: None)
#      StatefulSet 的 serviceName 必须指向一个 Headless Service。k8s 的校验是硬性的：
#      指向 ClusterIP Service 的话 `kubectl apply` 直接报
#      "spec.serviceName: Required value" 或 StatefulSet 控制器不工作。
#
#   2. z-surl-backend (ClusterIP)
#      前端 nginx / Ingress 真正用来访问后端的地址。ClusterIP 会在所有就绪副本间
#      做 round-robin，所以前端**不需要**知道有几个后端 —— 这正是 Mode 3 想要的解耦。
#      扩容后端只需改 StatefulSet 的 replicas，Service 与前端都不用动。
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: z-surl-backend-headless
  namespace: z-surl
  labels:
    app.kubernetes.io/name: z-surl
    app.kubernetes.io/component: backend
spec:
  clusterIP: None
  # 只做 StatefulSet 的身份解析，不对外
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: z-surl
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: z-surl-backend
  namespace: z-surl
  labels:
    app.kubernetes.io/name: z-surl
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: z-surl
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
