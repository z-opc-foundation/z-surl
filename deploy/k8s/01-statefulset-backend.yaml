# ============================================================================
# 后端 StatefulSet（005 规范 §1.3 指定的形态）
#
# 【为什么用 StatefulSet 而不是 Deployment】
# 按组织规范模板走。实际语义上 z-surl 后端是**无状态**的（短码在 MySQL，请求上下文里
# 没有任何本地状态），所以换成 Deployment 也完全成立。保留 StatefulSet 是为了与
# z-ctc / z-schedule 的既有形态一致，运维心智统一。
#
# 【replicas 的取值】
# Mode 3 集群默认 3。短链服务是读多写少，瓶颈在 DB 连接池而不是 CPU；
# 真的需要更多副本时先扩 z.base.db.surl.max-active（默认 10/副本），
# 否则副本越多、每个池越大，总连接数会先撞 MySQL 的 max_connections。
# ============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: z-surl-backend
  namespace: z-surl
  labels:
    app.kubernetes.io/name: z-surl
    app.kubernetes.io/component: backend
spec:
  serviceName: z-surl-backend-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: z-surl
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: z-surl
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 101
      containers:
        - name: backend
          # 与 deploy/env/.env 的 IMAGE_REPO / VERSION 对应。
          # 要换 tag 不用改本文件：`kubectl -n z-surl set image statefulset/z-surl-backend backend=<repo>/z-surl-admin:<tag>`
          image: 192.168.31.250:5000/zifang/z-surl-admin:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: z-surl-config
          env:
            # 凭证只从 Secret 来（env/configmap.yaml 里刻意没有密码）
            - name: ZSURL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: z-surl-secret
                  key: ZSURL_DB_PASSWORD
                  optional: false
          # 探针打 actuator health：DB 不可达时它 DOWN，编排层据此摘流量/重启。
          # 不用业务接口 —— 无参打 /api/ctc/surl/info 会因缺 mapKey 返回 400，
          # 探针会把"缺参数"误判成"不健康"。
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # readOnlyRootFilesystem: true 时 JVM 仍要写临时文件（hsperfdata / 堆转储），
          # 不给 /tmp 挂可写卷的话，Pod 会在启动阶段就 crash-loop：
          #   java.io.IOException: No such file or directory ... /tmp/hsperfdata_root
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
