# ============================================================================
# z-surl Secret —— ⚠️ 示例，**不要直接 kubectl apply** ⚠️
#
# 【为什么不入库】
# Secret 默认只是 base64 编码，**不是加密**；未启用 etcd encryption-at-rest 时
# 任何能读 namespace 的人都能还原出明文。把带真实密码的 Secret 提交进 Git，
# 等于把生产库密码发到代码托管上（008_组织规范/001_凭证管理规范.md 明令禁止）。
#
# 【正确用法，二选一】
# A) 现场生成（推荐，不留文件）：
#      kubectl -n z-surl create secret generic z-surl-secret \
#        --from-literal=ZSURL_DB_PASSWORD='<真实密码>'
#
# B) 用 kustomize / sealed-secrets / 外部密钥管理（External Secrets Operator），
#    仓库里只留"密文引用"，由集群侧解封。
#
# 应用顺序：00-namespace → 06-secret（先生成）→ 01/02/03/04/05
# 先建 Secret 再建 StatefulSet，否则 Pod 会卡在 CreateContainerConfigError
# （secret "z-surl-secret" not found）反复重启。
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: z-surl-secret
  namespace: z-surl
  labels:
    app.kubernetes.io/name: z-surl
type: Opaque
stringData:
  # 占位符。真实值走 kubectl create secret 或外部密钥管理，绝不写进仓库。
  ZSURL_DB_PASSWORD: "REPLACE_ME_VIA_KUBECTL_CREATE_SECRET"
