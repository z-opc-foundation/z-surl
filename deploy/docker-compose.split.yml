# ============================================================================
# Mode 2 · 分体（前端独立 nginx）
#
# 形态：frontend nginx :80 伺服 dist/，把 /api/** 与 /s/** 反代给 backend :8080。
# 入口：http://<host>:8088
#
# 适合：前端频繁迭代 / 前端团队独立发布 / 需要 CDN 缓存前端静态资源
#
# 启动：make split
#
# 与 Mode 3 的差别：后端只有 1 个副本，且没有跨副本的会话/连接复用。
# ============================================================================

name: z-surl-split

services:
  backend:
    image: ${IMAGE_REPO:-zifang}/z-surl-admin:${VERSION:-1.0.0}
    container_name: z-surl-backend
    restart: unless-stopped
    ports:
      - "${ZSURL_BACKEND_PORT:-8081}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${ZSURL_PROFILE:-prod}
      TZ: ${TZ:-Asia/Shanghai}
      ZSURL_DB_HOST: ${ZSURL_DB_HOST:-host.docker.internal}
      ZSURL_DB_PORT: ${ZSURL_DB_PORT:-3306}
      ZSURL_DB_NAME: ${ZSURL_DB_NAME:-oc}
      ZSURL_DB_USER: ${ZSURL_DB_USER:-root}
      ZSURL_DB_PASSWORD: ${ZSURL_DB_PASSWORD:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+UseSerialGC}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - zsurl

  frontend:
    image: ${IMAGE_REPO:-zifang}/z-surl-frontend:${VERSION:-1.0.0}
    container_name: z-surl-frontend
    restart: unless-stopped
    depends_on:
      backend:
        # 等 backend 真的 healthy 再放流量，而不是"容器起来了"就算数
        condition: service_healthy
    ports:
      - "${ZSURL_HTTP_PORT:-8088}:80"
    environment:
      # envsubst 在 nginx 启动时把模板里的 ${ZSURL_BACKEND_UPSTREAM} 替换掉。
      # Mode 2 只有一个后端，所以只给一条 server。
      ZSURL_BACKEND_UPSTREAM: "server backend:8080;"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q ok"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - zsurl

networks:
  zsurl:
    driver: bridge
